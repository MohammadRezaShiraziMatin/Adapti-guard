# Local model targets for EXP-004 generalization matrix
# Requires Ollama or vLLM endpoint at OLLAMA_BASE_URL (default http://localhost:11434)

models:
  local_qwen25_3b:
    provider: ollama
    model: qwen2.5:3b-instruct
    temperature: 0.0
    max_tokens: 512
    parameters: 3B
    description: "Qwen2.5-3B-Instruct (local)"

  local_llama32_3b:
    provider: ollama
    model: llama3.2:3b-instruct
    temperature: 0.0
    max_tokens: 512
    parameters: 3B
    description: "Llama-3.2-3B-Instruct (local)"

  local_phi35_mini:
    provider: ollama
    model: phi3.5:mini-instruct
    temperature: 0.0
    max_tokens: 512
    parameters: 3.8B
    description: "Phi-3.5-mini-instruct (local)"

  local_mistral_7b:
    provider: ollama
    model: mistral:7b-instruct-v0.3
    temperature: 0.0
    max_tokens: 512
    parameters: 7B
    description: "Mistral-7B-Instruct-v0.3 (local)"

  api_gemini:
    provider: openrouter
    model: google/gemini-2.0-flash-001
    temperature: 0.0
    max_tokens: 512
    optional: true
    description: "Gemini 2.0 Flash (optional API)"

preflight:
  ollama_models_required:
    - qwen2.5:3b-instruct
    - llama3.2:3b-instruct
    - phi3.5:mini-instruct
    - mistral:7b-instruct-v0.3
  command: "ollama pull <model>"
