name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # numpy>=2.5.2 (requirements-core) requires Python >=3.12
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Optional providers exercised by import-time unit tests (not live API).
          # Full requirements.txt is pinned and may conflict on fresh resolvers — do not use it in CI.
          pip install "google-genai>=1.0" "openai>=1.0"
      - name: Lint and type-check adaptive-guard modules
        run: |
          pip install ruff mypy
          ruff check src/adapti_guard/adaptation src/adapti_guard/runtime.py \
            src/adapti_guard/detector/hardened_detector.py \
            src/adapti_guard/defense/action_layer.py \
            src/adapti_guard/experiments/defense_baselines.py \
            tests/test_adaptive_q1_fixes.py tests/test_adaptive_redesign.py \
            scripts/q1_f3_adaptive_vs_fixed.py scripts/q1_f3_adaptive_vs_fixed_v2.py
          mypy --ignore-missing-imports src/adapti_guard/adaptation \
            src/adapti_guard/runtime.py \
            src/adapti_guard/detector/hardened_detector.py \
            src/adapti_guard/defense/action_layer.py
      - name: Run tests with coverage
        run: pytest --cov=adapti_guard --cov-report=term-missing
