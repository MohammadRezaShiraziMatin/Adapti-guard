name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Optional providers exercised by import-time unit tests (not live API).
          # Full requirements.txt is pinned and may conflict on fresh resolvers — do not use it in CI.
          pip install "google-genai>=1.0" "openai>=1.0"
