name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Full requirements cover optional providers used by import-time tests
          pip install -r requirements.txt || pip install -r requirements-core.txt
      - name: Run full pytest suite
        env:
          RUN_LLM_TESTS: "0"
        run: pytest -q --tb=line
